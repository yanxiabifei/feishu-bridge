name: 功能建议
description: 希望它能做到现在做不到的事
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 先讲场景，再讲方案。比如「我在三个项目之间来回切，每次都要 @ 机器人加别名，想让…」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么做
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 包括「现在凑合怎么用」也可以。

  - type: dropdown
    id: willing
    attributes:
      label: 愿意提交 PR 吗
      options:
        - 愿意，可以按维护者的意见改
        - 可以试试，需要指导
        - 只能提想法
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > 注意：桌面端镜像窗口（Plan B）和 macOS/Linux 支持已在路线图里，见 [ROADMAP.md](https://github.com/yanxiabifei/feishu-bridge/blob/main/ROADMAP.md)。
